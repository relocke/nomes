name: Nome validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: nome-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate signed Nome change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false
      - name: Check out proposal as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install trusted locked dependencies without lifecycle scripts
        working-directory: validator/.github/validator
        run: npm ci --ignore-scripts
      - name: Check signed changes and live account authority
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node validator/.github/validator/scripts/validate-nome-registry.mts "$GITHUB_WORKSPACE/registry" "$BASE_SHA" "$HEAD_SHA" "$HEAD_BRANCH"
